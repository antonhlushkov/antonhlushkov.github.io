---
layout: default
title: Tags
---

<h1>Tags</h1>

<nav class="tags-list">
  <ul>
    {%- for tag in site.tags -%}
      <li><a href="{{ '/tags/' | relative_url }}?tag={{ tag[0] | slugify }}">{{ tag[0] }} ({{ tag[1].size }})</a></li>
    {%- endfor -%}
  </ul>
</nav>

<section id="filtered-posts" class="filtered-posts">
  <!-- Posts matching the selected tag will be rendered here by JS -->
</section>

<script>
// POSTS data generated at build time; used to render filtered lists client-side
var POSTS = [
  {%- for post in site.posts -%}
  {
    "title": {{ post.title | jsonify }},
    "url": {{ post.url | relative_url | jsonify }},
    "date": {{ post.date | date: "%b %-d, %Y" | jsonify }},
    "tags": {{ post.tags | jsonify }},
    "categories": {{ post.categories | jsonify }}
  }{% unless forloop.last %},{% endunless %}
  {%- endfor -%}
];

(function(){
  const params = new URLSearchParams(window.location.search);
  const tag = params.get('tag');
  const container = document.getElementById('filtered-posts');
  if (!container) return;
  container.innerHTML = '';
  if (!tag) {
    container.innerHTML = '<p class="notice">Select a tag to view posts.</p>';
    return;
  }
  const matched = POSTS.filter(p => (p.tags || []).map(t => slugify(t)).includes(tag));
  if (!matched.length) {
    container.innerHTML = '<p class="notice">No posts found for this tag.</p>';
    return;
  }
  matched.forEach(p => {
    const article = document.createElement('article');
    article.className = 'archive-post';
    article.innerHTML = '<h2><a href="' + p.url + '">' + escapeHtml(p.title) + '</a></h2>' +
                        '<p class="meta">' + p.date + '</p>';
    container.appendChild(article);
  });

  function slugify(s){
    return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"]/g, function (s) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[s]; });
  }
})();
</script>
